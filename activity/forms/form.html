<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <br><br>
        <label for="favorite-class">Favorite Class:</label>
        <select id="favorite-class" name="favorite-class">
            <option disabled hidden selected>Select One</option>
            <option>Web Design</option>
            <option>Object-Oriented Programming II</option>
            <option>Database Management</option>
            <option>Effective Pedagogy</option>
            <option>Culturally Responsive Education</option>
            <option>History and Ethics of Computing</option>
            <option>Microbiology Research</option>
            <option>Biostatistics Research</option>
        </select>
        <br><br>
        <label>Skills:</label>
        <input type="checkbox" id="java" name="java">
        <label for="java">Java</label>
        <input type="checkbox" id="python" name="python">
        <label for="python">Python</label>
        <input type="checkbox" id="html" name="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="css">
        <label for="css">CSS</label>
        <input type="checkbox" id="bash" name="bash">
        <label for="bash">Bash</label>
        <br><br>
        <label>Message:</label>
        <br>
        <textarea name="message">
        </textarea>
        <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
